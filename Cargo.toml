[package]
name = "q"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[features]
default = ["completion-scripts"]
# Enables the `c completion [shell]` command. Distributions shipping the files directly can disable this to get a smaller binary.
completion-scripts = []

[[bin]]
name = "quilt"
path = "src/bin/quilt.rs"

[[bin]]
name = "guards"
path = "src/bin/guards.rs"

[dependencies]
anyhow = "1.0.102"
jiff = "1.0.1"
lexopt = "0.3.2"
p2 = { path = "p2" }
shlex = "1.3.0"
tempfile = "3.27.0"
walkdir = "2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
