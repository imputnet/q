name: Setup CI
description: Install system packages, install Rust, and restore Cargo cache.

inputs:
  apt-packages:
    description: Space-separated apt packages to install.
    required: false
    default: diffstat graphviz
  rust-components:
    description: Comma-separated Rust toolchain components to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.apt-packages }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
